<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>وجه ذكي حي</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,Tahoma,sans-serif;color:#dfe9ff}
#stage{position:fixed;inset:0;background:#000;overflow:hidden;touch-action:manipulation}
#world{position:absolute;inset:0;pointer-events:none}
#avatar{position:absolute;left:0;top:0;transform-origin:50% 50%;pointer-events:auto;touch-action:none;cursor:pointer; -webkit-tap-highlight-color:transparent}
.hand{position:absolute;left:0;top:0;pointer-events:none}
.hand svg{width:100%;height:100%;display:block}
#prop{position:absolute;left:0;top:0;pointer-events:none;opacity:0;transition:opacity .3s}
#prop svg{width:100%;height:100%;display:block}
#bubble{position:absolute;inset:0;display:none;z-index:1;pointer-events:none;overflow:hidden;direction:rtl}
.kinetic-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.kinetic-copy{position:absolute;max-width:min(68vw,560px);min-width:0;text-align:center;direction:rtl;transform:translate(-50%,-50%);font-weight:850;line-height:1.35;letter-spacing:-.035em;color:#f4f8ff;text-wrap:balance;text-shadow:0 3px 18px #000,0 0 28px rgba(59,130,246,.24);animation:kineticIn .42s cubic-bezier(.16,1,.3,1) both}
.kinetic-copy .kinetic-tag{display:block;font-size:clamp(11px,1.5vw,14px);font-weight:650;letter-spacing:.04em;color:#93c5fd;text-shadow:0 0 16px rgba(59,130,246,.5);margin-bottom:7px}
.kinetic-copy .kinetic-words{display:block;font-size:clamp(23px,5vw,54px)}
.kinetic-copy .kinetic-words .accent{color:#7dd3fc;background:linear-gradient(100deg,#60a5fa,#a5f3fc,#fff);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.kinetic-copy.small .kinetic-words{font-size:clamp(18px,3.3vw,32px)}
.kinetic-copy .kinetic-sub{display:block;margin-top:7px;font-size:clamp(11px,1.5vw,15px);font-weight:550;color:#cbd5e1;letter-spacing:0;text-shadow:0 2px 10px #000}
.touch-ripple{position:absolute;width:18px;height:18px;border:2px solid #7dd3fc;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);animation:touchRipple .7s ease-out forwards;box-shadow:0 0 18px rgba(56,189,248,.55)}
@keyframes touchRipple{to{width:100px;height:100px;opacity:0;filter:blur(2px)}}
.kinetic-callout{position:absolute;max-width:40vw;padding:2px 4px;border:0;border-bottom:1px solid rgba(125,211,252,.65);border-radius:0;background:transparent;color:#bae6fd;font-size:clamp(11px,1.7vw,15px);font-weight:700;text-shadow:0 2px 10px #000;transform:translate(-50%,-50%);animation:kineticIn .45s ease both}
@keyframes kineticIn{from{opacity:0;filter:blur(7px);transform:translate(-50%,-44%) scale(.94)}to{opacity:1;filter:blur(0);transform:translate(-50%,-50%) scale(1)}}
@keyframes kineticOut{to{opacity:0;filter:blur(5px);transform:translate(-50%,-58%) scale(1.03)}}
@media(max-width:560px){.kinetic-copy{max-width:74vw}.kinetic-copy .kinetic-words{font-size:clamp(22px,7vw,38px)}.kinetic-copy.small .kinetic-words{font-size:clamp(17px,5vw,26px)}.kinetic-callout{max-width:45vw}}
#stat{position:absolute;top:calc(16px + env(safe-area-inset-top));left:14px;font-size:12px;background:rgba(10,20,40,.85);padding:5px 10px;border-radius:12px;max-width:65%;color:#9fb8e0;opacity:0;transition:opacity .3s;z-index:2}
#stat:not(:empty){opacity:1}
#gear{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:1px solid #1d3558;background:#0b1830;color:#dfe9ff;font-size:20px;cursor:pointer;z-index:3}
#dock{position:absolute;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:2;transition:all .28s ease}
#row{width:min(640px,100%);display:flex;align-items:center;gap:8px;background:#0b1830;border:1px solid #1d3558;border-radius:999px;padding:6px}
